name: Publish

# A signed v* tag: the CI gates, then the wheel and sdist built, installed and run, then
# PyPI through trusted publishing. No token is stored in the repository. The tag's
# documentation site is built and uploaded as the `site` artifact, to deploy by hand.
on:
  push:
    tags: ['v*']

# Read-only by default; only the publish job holds an identity, PyPI's, and it runs only
# actions pinned to a commit, their release named beside them.
permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
      - name: The tag is the package's version
        run: |
          version=$(uv version --short)
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
      - run: uv build
      - name: The wheel installs and runs, away from the checkout
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/semis --help
          /tmp/smoke/bin/semis decode-uuid 02030405-5001-8001-8000-000000000001
          /tmp/smoke/bin/python -c "import fraiseql_semis; print(fraiseql_semis.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # The site this tag describes, built from the tag and uploaded, not deployed: see
  # site/DEPLOYMENT.md for serving it at semis.fraiseql.dev.
  site:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check-links
      - name: The site names the tagged release
        run: |
          grep -q "semis version ${GITHUB_REF_NAME#v}: releases" dist/index.html \
            || { echo "the site does not describe ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build, site]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
