name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

# Every action is pinned to a commit, its release named beside it: a tag can be moved.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src/fraiseql_semis/
      # The unit and contract tests alone: coverage is measured where the whole suite runs.
      - run: uv run pytest -m 'not integration' --no-cov
      # The same tests on the lowest release of every direct dependency: the floors in
      # pyproject.toml are ones semis runs on.
      - run: uv run --resolution lowest-direct --isolated --all-extras pytest -m 'not integration' --no-cov
      # A wall-clock floor, timed without coverage's tracer. A hosted runner draws under
      # half the rate the PRD's 10,000 rows/s was measured against, so it asks for half.
      - run: uv run pytest tests/performance --no-cov
        env:
          SEMIS_RATE_FLOOR: 5000

  # The documentation site: built as semis.fraiseql.dev serves it, every internal link and
  # anchor resolving. Its examples are run by the harness, in the jobs above.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test scripts/
      - run: bun run build
      - run: bun run check-links

  # On the oldest PostgreSQL semis supports and the newest.
  integration:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        postgresql: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: semis
          POSTGRES_PASSWORD: semis
          POSTGRES_DB: semis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEMIS_TEST_DATABASE_URL: postgresql://semis:semis@localhost:5432/semis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
      - run: uv sync --all-extras --locked
      # The whole suite, so the coverage threshold holds over every test.
      - run: uv run pytest
