name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src/fraiseql_semis/
      - run: uv run pytest -m 'not integration'
      # A wall-clock floor, timed without coverage's tracer. A hosted runner draws under
      # half the rate the PRD's 10,000 rows/s was measured against, so it asks for half.
      - run: uv run pytest tests/performance --no-cov
        env:
          SEMIS_RATE_FLOOR: 5000

  integration:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: semis
          POSTGRES_PASSWORD: semis
          POSTGRES_DB: semis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEMIS_TEST_DATABASE_URL: postgresql://semis:semis@localhost:5432/semis_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-extras --locked
      - run: uv run pytest -m integration
